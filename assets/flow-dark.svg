<text x="116" y="476" fill="#f5f5f5" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600">Every brief ends the same way:</text><text x="344" y="476" fill="#bfc0c0" font-family="'Geist Mono',ui-monospace,monospace" font-size="9">report to Anderton by name · never deploy · never message off the machine</text>
