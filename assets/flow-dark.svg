<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-dark-title flow-dark-desc" id="flow-dark-root">
<title id="flow-dark-title">How Anderton runs a repository</title>
<desc id="flow-dark-desc">You talk to one Claude Code session, the Anderton. It watches your other sessions, starts a worker session for each task, and is the only one that ships to production.</desc>
<rect width="960" height="600" fill="#2d3142"/>
<defs>
      <style>#flow-dark-root { --paper:#2d3142;--paper-2:#393e53;--ink:#f5f5f5;--muted:#bfc0c0;--soft:#949eb2;--rule:rgba(245,245,245,.12);--accent:#f08a59;--accent-tint:rgba(240,138,89,.10);--link:#739fdf;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #flow-dark-root { font-family: var(--sans); color: var(--ink); }
      #flow-dark-root .subtitle { color:var(--muted);font-size:14px;line-height:1.5;max-width:720px;margin-bottom:24px }</style><marker id="flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bfc0c0"/></marker><marker id="flow-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f08a59"/></marker></defs>
