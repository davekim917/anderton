<rect x="376" y="316" width="208" height="56" rx="6" fill="#f5f5f5"/><rect x="376" y="316" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><rect x="384" y="324" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" opacity=".45"/><text x="404" y="333" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" text-anchor="middle" letter-spacing=".08em">WORKER</text><text x="480" y="352" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Find slow import</text><text x="480" y="365" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" text-anchor="middle">wt-slow-import</text>
<rect x="660" y="316" width="208" height="56" rx="6" fill="#f5f5f5"/><rect x="660" y="316" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><rect x="668" y="324" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" opacity=".45"/><text x="688" y="333" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" text-anchor="middle" letter-spacing=".08em">WORKER</text><text x="764" y="352" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Update docs</text><text x="764" y="365" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" text-anchor="middle">wt-update-docs</text>
<rect x="92" y="448" width="776" height="48" rx="6" fill="#f5f5f5"/><rect x="92" y="448" width="776" height="48" rx="6" fill="#2d3142" stroke="#5a6580" stroke-dasharray="4,4" fill-opacity=".02"/>
<text x="116" y="476" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600">Every brief ends the same way:</text><text x="344" y="476" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="9">report to Anderton by name · no deploys or outside messages unless the task says so</text>
<line x1="40" y1="532" x2="920" y2="532" stroke="#2d3142" stroke-opacity=".12"/>
<text x="40" y="560" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" letter-spacing=".14em">LEGEND</text>
