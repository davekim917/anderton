<rect x="712" y="160" width="208" height="48" rx="6" fill="#f5f5f5"/><rect x="712" y="160" width="208" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-dasharray="4,4" fill-opacity=".05" stroke-opacity=".50"/><text x="816" y="188" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Production</text><text x="816" y="201" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" text-anchor="middle">restarts need your OK</text>
