<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc" id="flow-root">
<title id="flow-title">How Anderton runs a repository</title>
<desc id="flow-desc">You talk to one Claude Code session, the Anderton. It watches your other sessions, starts a worker session for each task, and is the only one that ships to production.</desc>
<rect width="960" height="600" fill="#f5f5f5"/>
<defs>
      <style>#flow-root { --paper:#f5f5f5;--paper-2:#fff;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--rule:rgba(45,49,66,.12);--accent:#bf4520;--accent-tint:rgba(191,69,32,.08);--link:#2e5aa8;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #flow-root { font-family: var(--sans); color: var(--ink); }
      #flow-root .subtitle { color:var(--muted);font-size:14px;line-height:1.5;max-width:720px;margin-bottom:24px }</style><marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker></defs>
